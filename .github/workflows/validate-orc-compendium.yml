name: Validate public compendium

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install development checks
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate system definitions and public content
        run: |
          python3 tools/eplus_dev.py check --json
      - name: Build and inspect the single-install release
        run: |
          python3 tools/package_public_release.py
          python3 tools/eplus_dev.py inspect-release --json
